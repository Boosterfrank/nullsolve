# Builds the bookmarklet and install page and publishes dist/ to GitHub Pages.
# Needs Settings -> Pages -> Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    # The second branch is temporary, so the first deployment can happen
    # before this lands on main; remove it after merging.
    branches: [main, claude/wonderful-bohr-xfgxp1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build tools
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build (the loader bookmarklet points at the Pages URL)
        run: node build.js --host="${{ steps.pages.outputs.base_url }}"
      - name: Unit tests
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
